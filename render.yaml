# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: brent-spread-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://brent-spread-backtester.vercel.app
